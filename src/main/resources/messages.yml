Messages:
  GENERAL:
    PREFIX: "<gold><b>ᴡᴀꜰᴇʀᴍᴄ <reset><dark_gray>||"
    USAGE: "<dark_gray>» <gray>Utilizzo<dark_gray>: <gold>/<command>"
    NO_PERMISSION: "<prefix> <red>Non hai i permessi per farlo."
    CONSOLE_NOT_ALLOWED: "<prefix> <red>La console non può eseguire questo comando."
    CUSTOM_COMMAND_NO_PERMISSION: "<prefix> <red>Non sei autorizzato a eseguire questo comando."
    INVALID_PLAYER: "<prefix> <yellow><player> <red>non è online!"
