  HELP:
    PLUGIN:
      - "<prefix> <gray>Comandi disponibili<dark_gray>:"
      - "<dark_gray>/<gold>akropolis info <dark_gray>- <gray>Info sulla config attuale"
      - "<dark_gray>/<gold>akropolis scoreboard <dark_gray>- <gray>Attiva/disattiva la scoreboard"
      - "<dark_gray>/<gold>akropolis hotbar <dark_gray>- <gray>Attiva/disattiva gli oggetti hotbar"
      - "<dark_gray>/<gold>akropolis holo [opzione] <dark_gray>- <gray>Comandi per gli ologrammi"
      - "<dark_gray>/<gold>akropolis open <menu> <dark_gray>- <gray>Apre un menu personalizzato"
      - "<dark_gray>/<gold>vanish <dark_gray>- <gray>Attiva/disattiva il vanish"
      - "<dark_gray>/<gold>fly [player] <dark_gray>- <gray>Attiva/disattiva il volo"
      - "<dark_gray>/<gold>setlobby <dark_gray>- <gray>Imposta il punto di spawn"
      - "<dark_gray>/<gold>lobby <dark_gray>- <gray>Teletrasportati allo spawn"
      - "<dark_gray>/<gold>gamemode <gamemode> [player] <dark_gray>- <gray>Cambia la tua modalità"
      - "<dark_gray>/<gold>gmc [player] <dark_gray>- <gray>Passa in modalità creativa"
      - "<dark_gray>/<gold>gms [player] <dark_gray>- <gray>Passa in modalità sopravvivenza"
      - "<dark_gray>/<gold>gma [player] <dark_gray>- <gray>Passa in modalità avventura"
      - "<dark_gray>/<gold>gmsp [player] <dark_gray>- <gray>Passa in modalità spettatore"
