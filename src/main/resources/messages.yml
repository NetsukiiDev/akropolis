      - "<dark_gray>/<gold>lockchat <dark_gray>- <gray>Blocca/sblocca la chat globale"
    HOLOGRAM:
      - "<prefix> <gray>Comandi ologrammi disponibili<dark_gray>:"
      - "<dark_gray>/<gold>akropolis holo list <dark_gray>- <gray>Lista di tutti gli ologrammi"
      - "<dark_gray>/<gold>akropolis holo create <id> <dark_gray>- <gray>Crea un nuovo ologramma"
      - "<dark_gray>/<gold>akropolis holo remove <id> <dark_gray>- <gray>Elimina un ologramma esistente"
      - "<dark_gray>/<gold>akropolis holo move <id> <dark_gray>- <gray>Sposta un ologramma"
      - "<dark_gray>/<gold>akropolis holo setline <id> <linea> <testo> <dark_gray>- <gray>Imposta riga ologramma"
      - "<dark_gray>/<gold>akropolis holo addline <id> <testo> <dark_gray>- <gray>Aggiungi riga all'ologramma"
      - "<dark_gray>/<gold>akropolis holo removeline <id> <linea> <dark_gray>- <gray>Rimuovi riga dall'ologramma"
    SONG_PLAYER:
      - "<prefix> <gray>Comandi riproduttore musicale disponibili<dark_gray>:"
      - "<dark_gray>/<gold>akropolis sp setpos <dark_gray>- <gray>Imposta posizione del riproduttore"
      - "<dark_gray>/<gold>akropolis sp skip <dark_gray>- <gray>Salta una canzone"

